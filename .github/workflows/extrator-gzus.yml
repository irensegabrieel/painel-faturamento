name: Extrator G.Z.U.S.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extrator-gzus-main
  cancel-in-progress: false

jobs:
  executar-extrator:
    runs-on: ubuntu-latest

    env:
      TZ: "America/Sao_Paulo"
      HEADLESS: "1"
      MATRICULA: ${{ secrets.MATRICULA }}
      SENHA: ${{ secrets.SENHA }}
      GITHUB_DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      GITHUB_DASHBOARD_REPO: ${{ secrets.DASHBOARD_REPO }}
      GITHUB_DASHBOARD_BRANCH: "main"
      GITHUB_DASHBOARD_REMOTE_DIR: "dashboard"
      GZUS_POS_EXTRATOR_AUTO: "true"
      GZUS_PROJETO_PAINEL_DIR: ${{ github.workspace }}
      EXTRATOR_ARQUIVO: "Extrator_19_EAs_SAO_MIGUEL_TRATAMENTO_CORRIGIDO_GITHUB_502_CORRIGIDO.pyw"

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-github-actions.txt

      - name: Executar extrator
        run: |
          python run_extrator_cloud.py

      - name: Pré-calcular tabelas instantâneas
        run: |
          python precalcular_dashboard.py

      - name: Commit das tabelas instantâneas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dashboard/gzus_dashboard.db
          git add dashboard/*.csv
          git add dashboard/*.xlsx

          if git diff --cached --quiet; then
            echo "Nada para commitar."
            exit 0
          fi

          git commit -m "Atualiza dashboard automático"

          for tentativa in 1 2 3; do
            echo "Tentativa de push: $tentativa"

            git pull --rebase origin main

            if git push origin main; then
              echo "Push concluído."
              exit 0
            fi

            echo "Push falhou. Aguardando antes de tentar de novo..."
            sleep 10
          done

          echo "Não foi possível fazer push após 3 tentativas."
          exit 1
