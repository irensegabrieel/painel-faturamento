name: Extrator G.Z.U.S.

on:
  workflow_dispatch:

  schedule:
    # Segunda a sexta — 07:00 às 18:45 (Brasil / UTC-3)
    # GitHub Actions usa UTC: 10:00 às 21:45 UTC
    - cron: "0,15,30,45 10-21 * * 1-5"

    # Sábado — 07:00 às 12:45 (Brasil / UTC-3)
    # GitHub Actions usa UTC: 10:00 às 15:45 UTC
    - cron: "0,15,30,45 10-15 * * 6"

permissions:
  contents: write

jobs:
  executar-extrator:
    runs-on: ubuntu-latest

    env:
      HEADLESS: "1"
      MATRICULA: ${{ secrets.MATRICULA }}
      SENHA: ${{ secrets.SENHA }}
      GITHUB_DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
      GITHUB_DASHBOARD_REPO: ${{ secrets.DASHBOARD_REPO }}
      GITHUB_DASHBOARD_BRANCH: "main"
      GITHUB_DASHBOARD_REMOTE_DIR: "dashboard"
      GZUS_POS_EXTRATOR_AUTO: "true"
      GZUS_PROJETO_PAINEL_DIR: ${{ github.workspace }}
      EXTRATOR_ARQUIVO: "Extrator_19_EAs_SAO_MIGUEL_TRATAMENTO_CORRIGIDO_GITHUB_502_CORRIGIDO.pyw"

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-github-actions.txt

      - name: Executar extrator
        run: |
          python run_extrator_cloud.py
